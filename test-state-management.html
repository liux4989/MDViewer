<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>State Management Test - Floating TOC</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }
        .test-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 1200px;
            margin: 0 auto;
        }
        .test-header {
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .test-output {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 13px;
            line-height: 1.4;
            overflow-x: auto;
            white-space: pre-wrap;
            max-height: 600px;
            overflow-y: auto;
        }
        .run-button {
            background: #007acc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
        }
        .run-button:hover {
            background: #005a9e;
        }
        .clear-button {
            background: #666;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .clear-button:hover {
            background: #555;
        }
        .status {
            margin: 10px 0;
            padding: 8px 12px;
            border-radius: 4px;
            font-weight: 500;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="test-header">
            <h1>🧪 State Management System Test</h1>
            <p>Testing task 9: Create state management system and active section highlighting</p>
            <div>
                <button class="run-button" onclick="runStateTest()">Run State Management Test</button>
                <button class="run-button" onclick="runReactTest()">Run React Integration Test</button>
                <button class="clear-button" onclick="clearOutput()">Clear Output</button>
            </div>
        </div>

        <div id="status"></div>
        
        <div class="test-output" id="output">
            Click "Run State Management Test" to start testing the state management system...
        </div>
    </div>

    <!-- Load the compiled JavaScript -->
    <script src="main.js"></script>
    
    <script>
        // Capture console output
        const originalConsole = {
            log: console.log,
            error: console.error,
            warn: console.warn
        };

        let outputBuffer = [];

        function captureConsole() {
            console.log = (...args) => {
                const message = args.map(arg => 
                    typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
                ).join(' ');
                outputBuffer.push(message);
                updateOutput();
                originalConsole.log(...args);
            };

            console.error = (...args) => {
                const message = '❌ ERROR: ' + args.map(arg => 
                    typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
                ).join(' ');
                outputBuffer.push(message);
                updateOutput();
                originalConsole.error(...args);
            };

            console.warn = (...args) => {
                const message = '⚠️ WARNING: ' + args.map(arg => 
                    typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
                ).join(' ');
                outputBuffer.push(message);
                updateOutput();
                originalConsole.warn(...args);
            };
        }

        function updateOutput() {
            const outputEl = document.getElementById('output');
            outputEl.textContent = outputBuffer.join('\n');
            outputEl.scrollTop = outputEl.scrollHeight;
        }

        function setStatus(message, type = 'info') {
            const statusEl = document.getElementById('status');
            statusEl.className = `status ${type}`;
            statusEl.textContent = message;
        }

        function clearOutput() {
            outputBuffer = [];
            updateOutput();
            setStatus('Output cleared', 'info');
        }

        async function runStateTest() {
            try {
                setStatus('Running state management test...', 'info');
                captureConsole();
                
                // Import and run the test
                if (window.testStateManagement) {
                    await window.testStateManagement();
                    setStatus('State management test completed successfully!', 'success');
                } else {
                    throw new Error('testStateManagement function not found. Make sure main.js is loaded.');
                }
            } catch (error) {
                setStatus(`Test failed: ${error.message}`, 'error');
                console.error('Test execution error:', error);
            }
        }

        async function runReactTest() {
            try {
                setStatus('Running React integration test...', 'info');
                captureConsole();
                
                // Import and run the React test
                if (window.testReactStateIntegration) {
                    await window.testReactStateIntegration();
                    setStatus('React integration test completed successfully!', 'success');
                } else {
                    throw new Error('testReactStateIntegration function not found. Make sure main.js is loaded.');
                }
            } catch (error) {
                setStatus(`React test failed: ${error.message}`, 'error');
                console.error('React test execution error:', error);
            }
        }

        // Initialize
        captureConsole();
        setStatus('Ready to run tests', 'info');
    </script>
</body>
</html>
