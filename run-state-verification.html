<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>State Management Verification - Task 9</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .output {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 13px;
            line-height: 1.4;
            overflow-x: auto;
            white-space: pre-wrap;
            max-height: 500px;
            overflow-y: auto;
        }
        .run-button {
            background: #007acc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
        }
        .run-button:hover {
            background: #005a9e;
        }
        .status {
            margin: 10px 0;
            padding: 8px 12px;
            border-radius: 4px;
            font-weight: 500;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 Task 9 Verification</h1>
            <p><strong>Task:</strong> Create state management system and active section highlighting</p>
            <p><strong>Requirements:</strong> 3.1, 3.2, 3.3, 3.4, 4.1</p>
            <button class="run-button" onclick="runVerification()">Run Verification</button>
        </div>

        <div id="status"></div>
        
        <div class="output" id="output">
            Click "Run Verification" to test the state management implementation...
        </div>
    </div>

    <!-- Load the compiled JavaScript -->
    <script src="main.js"></script>
    
    <script>
        let outputBuffer = [];

        // Capture console output
        const originalConsole = {
            log: console.log,
            error: console.error
        };

        function captureConsole() {
            console.log = (...args) => {
                const message = args.map(arg => 
                    typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
                ).join(' ');
                outputBuffer.push(message);
                updateOutput();
                originalConsole.log(...args);
            };

            console.error = (...args) => {
                const message = '❌ ERROR: ' + args.map(arg => 
                    typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
                ).join(' ');
                outputBuffer.push(message);
                updateOutput();
                originalConsole.error(...args);
            };
        }

        function updateOutput() {
            const outputEl = document.getElementById('output');
            outputEl.textContent = outputBuffer.join('\n');
            outputEl.scrollTop = outputEl.scrollHeight;
        }

        function setStatus(message, type = 'info') {
            const statusEl = document.getElementById('status');
            statusEl.className = `status ${type}`;
            statusEl.textContent = message;
        }

        async function runVerification() {
            try {
                outputBuffer = [];
                setStatus('Running state management verification...', 'info');
                captureConsole();
                
                if (window.verifyStateManagement) {
                    const result = await window.verifyStateManagement();
                    if (result) {
                        setStatus('✅ Task 9 implementation verified successfully!', 'success');
                    } else {
                        setStatus('❌ Verification failed - see output for details', 'error');
                    }
                } else {
                    throw new Error('verifyStateManagement function not found. Make sure main.js is loaded.');
                }
            } catch (error) {
                setStatus(`❌ Verification failed: ${error.message}`, 'error');
                console.error('Verification error:', error);
            }
        }

        // Initialize
        captureConsole();
        setStatus('Ready to run verification', 'info');
    </script>
</body>
</html>
